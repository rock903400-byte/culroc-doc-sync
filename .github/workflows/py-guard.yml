name: Python Guard

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile check (no test run)
        run: python -m compileall -q $(git ls-files '*.py')

      - name: No secrets committed
        run: |
          ! git ls-files | grep -Ei '\.(pem|key|p12)$|serviceAccount.*\.json$|(^|/)\.env(\.|$)'
